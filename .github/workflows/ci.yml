name: CI

on:
  pull_request:
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun run lint
      - run: bun run format:check
      - run: bun run test
      - run: bun run build

  # The library claims to run on Node, Bun and Deno, and on Windows paths. These
  # jobs are separate from `check` so a platform problem is easy to tell apart
  # from a lint or type error.
  deno:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: 2.9.6
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bun run test:deno
      - run: bun run smoke:dist:deno

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run test
      - run: bun run build
      - run: bun run smoke:dist

  # The PostgreSQL, MySQL and Redis adapters, against real servers. The default test run
  # skips these (it uses PGlite for PostgreSQL and has no MySQL), so this job sets
  # the connection strings that switch them on.
  databases:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: adapters
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: adapters
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_REDIS_URL: redis://127.0.0.1:6379
      TEST_POSTGRES_URL: postgres://postgres:postgres@127.0.0.1:5432/adapters
      TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3306/adapters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun test test/databases.test.ts test/postgres.test.ts test/postgres-listen.test.ts test/mysql.test.ts test/mysql-poll.test.ts test/redis.test.ts

  # MariaDB, Percona Server and CockroachDB speak the MySQL and PostgreSQL
  # protocols, so they run the existing adapters unchanged. Each gets the same
  # tests as the server it imitates; CockroachDB has no LISTEN/NOTIFY, so it
  # skips the listener tests.
  compatible-databases:
    runs-on: ubuntu-latest
    services:
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: mysql
          MARIADB_DATABASE: adapters
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      percona:
        image: percona/percona-server:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
        ports:
          - 3308:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -pmysql"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - name: MariaDB
        env:
          TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3307/adapters
        run: bun test test/databases.test.ts test/mysql.test.ts test/mysql-poll.test.ts
      - name: Percona Server
        env:
          TEST_MYSQL_URL: mysql://root:mysql@127.0.0.1:3308/adapters
        run: |
          mysql -h 127.0.0.1 -P 3308 -uroot -pmysql -e "CREATE DATABASE IF NOT EXISTS adapters"
          bun test test/databases.test.ts test/mysql.test.ts test/mysql-poll.test.ts
      - name: CockroachDB
        env:
          TEST_POSTGRES_URL: postgres://root@127.0.0.1:26257/adapters?sslmode=disable
        run: |
          docker run -d --name cockroach -p 26257:26257 cockroachdb/cockroach:v25.2.0 start-single-node --insecure
          for attempt in $(seq 1 30); do
            docker exec cockroach ./cockroach sql --insecure -e "CREATE DATABASE IF NOT EXISTS adapters" && break
            sleep 2
          done
          bun test test/databases.test.ts

  # The NATS KV adapter, against a real NATS server with JetStream. The default test
  # run skips it (it uses an in-memory bucket).
  nats:
    runs-on: ubuntu-latest
    env:
      TEST_NATS_URL: nats://127.0.0.1:4222
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # A service container cannot be given `-js`, so the server is started here.
      - run: docker run -d --name nats -p 4222:4222 nats:2.11.8 -js
      - run: |
          for attempt in $(seq 1 30); do
            (echo > /dev/tcp/127.0.0.1/4222) 2>/dev/null && exit 0
            sleep 1
          done
          docker logs nats && exit 1
      - run: bun test test/nats-server.test.ts

  # The CouchDB adapter, against a real CouchDB server. The default test run skips it
  # (it uses an in-memory stand-in for CouchDB's HTTP API).
  couchdb:
    runs-on: ubuntu-latest
    services:
      couchdb:
        image: couchdb:3.5.0
        env:
          COUCHDB_USER: admin
          COUCHDB_PASSWORD: secret
        ports:
          - 5984:5984
        options: >-
          --health-cmd "curl -fsS http://127.0.0.1:5984/_up"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_COUCHDB_URL: http://127.0.0.1:5984
      TEST_COUCHDB_USER: admin
      TEST_COUCHDB_PASSWORD: secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      # A single node needs its system databases before it will create others.
      - run: >-
          curl -fsS -X POST -H "Content-Type: application/json"
          -u "$TEST_COUCHDB_USER:$TEST_COUCHDB_PASSWORD"
          "$TEST_COUCHDB_URL/_cluster_setup"
          -d '{"action":"enable_single_node","bind_address":"0.0.0.0","username":"admin","password":"secret","singlenode":true}'
      - run: bun test test/couchdb-server.test.ts

  # The S3 adapter, against an S3-compatible server. The default test run skips these
  # (it uses an in-memory store). moto implements S3's conditional writes, so it
  # checks the real request and response shapes through the AWS SDK.
  s3:
    runs-on: ubuntu-latest
    env:
      TEST_S3_ENDPOINT: http://127.0.0.1:5000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      # A virtual environment keeps moto away from the runner's system Python packages
      # (its pyOpenSSL clashes with the newer cryptography that moto installs).
      - run: |
          python3 -m venv "$RUNNER_TEMP/moto"
          "$RUNNER_TEMP/moto/bin/pip" install --quiet "moto[server]==5.2.4"
      - name: Start moto
        run: |
          nohup "$RUNNER_TEMP/moto/bin/moto_server" -H 127.0.0.1 -p 5000 \
            > "$RUNNER_TEMP/moto.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:5000/moto-api/ && exit 0
            sleep 1
          done
          echo "moto did not start" && cat "$RUNNER_TEMP/moto.log" && exit 1
      - run: bun install --frozen-lockfile
      - run: bun test test/s3.test.ts test/s3-server.test.ts

  # The S3 adapter against MinIO, a second real S3 server that enforces If-Match and
  # If-None-Match itself. MinIO no longer publishes binaries, so it is built from the
  # source commit pinned below (the default test run skips this).
  minio:
    runs-on: ubuntu-latest
    env:
      TEST_S3_ENDPOINT: http://127.0.0.1:9100
      TEST_S3_ACCESS_KEY_ID: minioadmin
      TEST_S3_SECRET_ACCESS_KEY: minioadmin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Build MinIO
        run: GOBIN="$RUNNER_TEMP/minio-bin" go install github.com/minio/minio@7aac2a2c5b7c
      - name: Start MinIO
        run: |
          mkdir -p "$RUNNER_TEMP/minio-data"
          MINIO_ROOT_USER=minioadmin MINIO_ROOT_PASSWORD=minioadmin \
            nohup "$RUNNER_TEMP/minio-bin/minio" server "$RUNNER_TEMP/minio-data" \
            --address 127.0.0.1:9100 --console-address 127.0.0.1:9101 \
            > "$RUNNER_TEMP/minio.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:9100/minio/health/live && exit 0
            sleep 1
          done
          echo "MinIO did not start" && cat "$RUNNER_TEMP/minio.log" && exit 1
      - run: bun install --frozen-lockfile
      - run: bun test test/s3.test.ts test/s3-server.test.ts

  # The Firestore adapter, against the Firestore emulator, through both SDKs. The
  # default test run skips this (it uses an in-memory collection). The emulator needs
  # Java 21, which the runner has installed but does not make the default.
  firestore:
    runs-on: ubuntu-latest
    env:
      TEST_FIRESTORE_EMULATOR: 127.0.0.1:8080
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Start the Firestore emulator
        run: |
          nohup bunx firebase-tools@15.34.0 emulators:start --only firestore \
            --project demo-storage-adapters > "$RUNNER_TEMP/firestore.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:8080 && exit 0
            sleep 2
          done
          echo "the Firestore emulator did not start" && cat "$RUNNER_TEMP/firestore.log" && exit 1
      - run: bun install --frozen-lockfile
      - run: bun test test/firestore.test.ts test/firestore-emulator.test.ts

  # The Realtime Database adapter, against the Realtime Database emulator, through both
  # SDKs. The default test run skips this (it uses an in-memory node). The emulator
  # needs Java 21, which the runner has installed but does not make the default.
  realtime:
    runs-on: ubuntu-latest
    env:
      TEST_RTDB_EMULATOR: 127.0.0.1:9000
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Use Java 21
        run: |
          echo "JAVA_HOME=$JAVA_HOME_21_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_21_X64/bin" >> "$GITHUB_PATH"
      - name: Start the Realtime Database emulator
        run: |
          nohup bunx firebase-tools@15.34.0 emulators:start --only database \
            --project demo-storage-adapters > "$RUNNER_TEMP/realtime.log" 2>&1 &
          for i in $(seq 1 60); do
            curl -s -o /dev/null http://127.0.0.1:9000 && exit 0
            sleep 2
          done
          echo "the Realtime Database emulator did not start" && cat "$RUNNER_TEMP/realtime.log" && exit 1
      - run: bun install --frozen-lockfile
      - run: bun test test/realtime.test.ts test/realtime-emulator.test.ts

  # The Supabase adapter, against a real PostgreSQL server and a real PostgREST (the
  # REST layer Supabase puts in front of its database), through the real supabase-js.
  # The default test run skips this (it uses an in-memory client). Realtime needs
  # Supabase's own server, so it is covered with a fake channel in the default run.
  supabase:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_SUPABASE_DB_URL: postgres://postgres:postgres@127.0.0.1:5432/postgres
      TEST_SUPABASE_REST_URL: http://127.0.0.1:3010
      TEST_SUPABASE_JWT_SECRET: test-only-secret-of-at-least-32-characters
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - name: Create the API roles
        run: |
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -f test/support/supabase-local.sql
          psql "$TEST_SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -c "alter role authenticator password 'authenticator'"
      - name: Start PostgREST
        env:
          POSTGREST_VERSION: 12.2.3
          POSTGREST_SHA256: 9f71269e61ac3a940281e93ff415760f5957e430e475ba4c3889f3ede7d5527c
          PGRST_DB_URI: postgres://authenticator:authenticator@127.0.0.1:5432/postgres
          PGRST_DB_SCHEMAS: public
          PGRST_DB_ANON_ROLE: anon
          PGRST_DB_MAX_ROWS: '1000'
          PGRST_JWT_SECRET: ${{ env.TEST_SUPABASE_JWT_SECRET }}
          PGRST_SERVER_HOST: 127.0.0.1
          PGRST_SERVER_PORT: '3010'
        run: |
          curl -fsSL -o "$RUNNER_TEMP/postgrest.tar.xz" \
            "https://github.com/PostgREST/postgrest/releases/download/v${POSTGREST_VERSION}/postgrest-v${POSTGREST_VERSION}-linux-static-x64.tar.xz"
          echo "${POSTGREST_SHA256}  $RUNNER_TEMP/postgrest.tar.xz" | sha256sum --check
          tar -xJf "$RUNNER_TEMP/postgrest.tar.xz" -C "$RUNNER_TEMP"
          nohup "$RUNNER_TEMP/postgrest" > "$RUNNER_TEMP/postgrest.log" 2>&1 &
          for i in $(seq 1 30); do
            curl -s -o /dev/null http://127.0.0.1:3010/ && exit 0
            sleep 1
          done
          echo "PostgREST did not start" && cat "$RUNNER_TEMP/postgrest.log" && exit 1
      - run: bun install --frozen-lockfile
      - run: bun test test/supabase.test.ts test/supabase-postgrest.test.ts

  # The browser adapters (localStorage, sessionStorage, IndexedDB) in real browsers:
  # the shared conformance suite run inside the browser, plus what only a browser can
  # show (storage events and BroadcastChannel across tabs, a sandboxed frame, real
  # quotas, IndexedDB races between tabs). The default test run uses fakes and skips
  # this. playwright-core is pinned exactly, so each engine is the same build as on a
  # laptop with the lockfile. One job per engine, and one engine failing does not stop
  # the others.
  browsers:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    env:
      TEST_BROWSER: ${{ matrix.browser }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
      - run: bun install --frozen-lockfile
      - run: bun run build
      - run: bunx playwright-core install --with-deps ${{ matrix.browser }}
      - run: bun test test/browser-real.test.ts
